name: build

# CI can prove the code builds and that it fails cleanly with no input.  It
# cannot prove the disk is byte-exact: that needs the two ROMs, and this
# repository ships no Nintendo data, so the CRC32 self-check only ever runs on
# a machine where the user supplied their own dumps.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (clang)
        run: |
          cc -std=c99 -pedantic -Wall -Wextra -Werror -O2 \
              -o smb1transpiler smb1transpiler.c sprites.c disk.c
      - name: Smoke test (no ROMs present)
        run: |
          mkdir empty && cd empty
          if ../smb1transpiler > log.txt 2>&1; then
            echo "expected a nonzero exit with no ROMs present"; exit 1
          fi
          grep -q "no Super Mario Bros" log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smb1transpiler-macos
          path: smb1transpiler

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (MinGW gcc)
        shell: bash
        run: |
          gcc -std=c99 -pedantic -Wall -Wextra -Werror -O2 -static \
              -o smb1transpiler.exe smb1transpiler.c sprites.c disk.c
      - name: Smoke test (no ROMs present)
        shell: bash
        run: |
          mkdir empty && cd empty
          if ../smb1transpiler.exe > log.txt 2>&1; then
            echo "expected a nonzero exit with no ROMs present"; exit 1
          fi
          grep -q "no Super Mario Bros" log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smb1transpiler-windows-mingw
          path: smb1transpiler.exe

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # vswhere sits at a fixed path on every Windows image, so the MSVC
      # environment can be located without a third-party action.
      - name: Build (MSVC cl)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /MT /W3 /WX /D_CRT_SECURE_NO_WARNINGS ^
             /Fe:smb1transpiler.exe smb1transpiler.c sprites.c disk.c
      - name: Smoke test (no ROMs present)
        shell: cmd
        run: |
          mkdir empty && cd empty
          ..\smb1transpiler.exe && exit /b 1
          ..\smb1transpiler.exe 2>&1 | findstr /c:"no Super Mario Bros" >nul || exit /b 1
          exit /b 0
      - uses: actions/upload-artifact@v4
        with:
          name: smb1transpiler-windows-msvc
          path: smb1transpiler.exe

  # Workflow artifacts expire after 90 days and need a GitHub login to
  # download, which is no good for the people most likely to want a prebuilt
  # binary.  A release is public and permanent, so tagging cuts one.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-mingw, windows-msvc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage the binaries
        run: |
          mkdir out
          cp dist/smb1transpiler-windows-mingw/smb1transpiler.exe \
             out/smb1transpiler-windows-x64.exe
          cp dist/smb1transpiler-macos/smb1transpiler \
             out/smb1transpiler-macos
          ls -l out
      # gh is preinstalled on the runner and GITHUB_TOKEN is enough, so the
      # release needs no third-party action.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes 'Standalone builds. No installer, no runtime to fetch: the
          Windows .exe links the CRT statically and needs only kernel32 and
          msvcrt.

          Put the binary in a folder with your own Super Mario Bros `.nes` and
          Super Mario All-Stars `.sfc` and run it there. It writes
          `out/smb1_vera.dsk` and verifies its own CRC32 (`8875B7F8`).

          This release contains no Nintendo data. You supply the ROMs.'
